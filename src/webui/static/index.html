<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoController</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1 id="device-name">PicoController</h1>
  <nav>
    <a class="active" href="/">Dashboard</a>
    <a href="/config">Configuration</a>
  </nav>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <section class="card">
    <h2>Mode</h2>
    <label class="field">
      <span>On</span>
      <input type="checkbox" id="mode-on">
    </label>
    <label class="field">
      <span>Current mode</span>
      <select id="mode-current"></select>
    </label>
    <label class="field">
      <span>Brightness <output id="brightness-value"></output></span>
      <input type="range" id="mode-brightness" min="1" max="100">
    </label>
    <label class="field">
      <span>Speed <output id="speed-value"></output></span>
      <input type="range" id="mode-speed" min="1" max="100">
    </label>
    <label class="field">
      <span>Color</span>
      <input type="color" id="mode-color">
    </label>
    <label class="field">
      <span>Direction</span>
      <select id="mode-direction">
        <option value="forward">Forward</option>
        <option value="backward">Backward</option>
      </select>
    </label>
  </section>

  <section class="card">
    <h2>Channels</h2>
    <label class="field">
      <span>MQTT</span>
      <input type="checkbox" id="mqtt-enabled">
    </label>
    <label class="field">
      <span>Button</span>
      <input type="checkbox" id="button-enabled">
    </label>
    <label class="field">
      <span>IR remote</span>
      <input type="checkbox" id="ir-enabled">
    </label>
  </section>

  <section class="card">
    <h2>Device</h2>
    <button id="restart-btn" class="danger">Restart device</button>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
