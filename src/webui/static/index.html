<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoController</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <!-- icon placeholder, swap for a real logo later -->
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="10" r="6"></circle>
        <line x1="9" y1="20" x2="15" y2="20"></line>
        <line x1="10" y1="17" x2="14" y2="17"></line>
      </svg>
    </span>
    <div class="titles">
      <a class="site-name" href="/">PicoController</a>
    </div>
  </div>
  <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
    <!-- icon placeholder -->
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <nav class="main-nav" id="main-nav">
    <a class="active" href="/">Dashboard</a>
    <a href="/modes">Modes</a>
    <a href="/config">Configuration</a>
  </nav>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <section class="card">
    <h2>Mode</h2>
    <label class="field">
      <span>On</span>
      <input type="checkbox" id="mode-on">
    </label>
    <label class="field">
      <span>Current mode</span>
      <select id="mode-current"></select>
    </label>
    <label class="field">
      <span>Brightness <output id="brightness-value"></output></span>
      <input type="range" id="mode-brightness" min="1" max="100">
    </label>
    <label class="field">
      <span>Speed <output id="speed-value"></output></span>
      <input type="range" id="mode-speed" min="1" max="100">
    </label>
    <label class="field">
      <span>Color</span>
      <input type="color" id="mode-color">
    </label>
    <label class="field">
      <span>Direction</span>
      <select id="mode-direction">
        <option value="forward">Forward</option>
        <option value="backward">Backward</option>
      </select>
    </label>
  </section>

  <section class="card">
    <h2>Channels</h2>
    <label class="field">
      <span>MQTT</span>
      <input type="checkbox" id="mqtt-enabled">
    </label>
    <label class="field">
      <span>Button</span>
      <input type="checkbox" id="button-enabled">
    </label>
    <label class="field">
      <span>IR remote</span>
      <input type="checkbox" id="ir-enabled">
    </label>
  </section>

  <section class="card">
    <h2>Device</h2>
    <button id="restart-btn" class="danger">Restart device</button>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
